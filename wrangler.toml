# Cloudflare Workers (sito statico + API recensioni)
name = "sito-farmacia-tortorici"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "recensioni-farmacia"
database_id = "a4622bd3-6b64-4d9c-b469-f83480fe683b"

# Segreti da impostare nel pannello Cloudflare (Settings > Variables and Secrets), NON qui:
#   ADMIN_PASSWORD  -> password della pagina /admin.html
#   IP_SALT         -> una stringa casuale qualsiasi
