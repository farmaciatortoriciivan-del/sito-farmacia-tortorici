# Cloudflare Workers (sito statico + API recensioni)
name = "sito-farmacia-tortorici"
main = "worker.js"
compatibility_date = "2025-01-01"
routes = [
  { pattern = "farmaciatortorici.com", custom_domain = true },
  { pattern = "www.farmaciatortorici.com", custom_domain = true }
]

# Workers AI (piano gratuito): sceglie le notizie di Farmacista33 adatte ai clienti
[ai]
binding = "AI"

[triggers]
crons = ["* * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "recensioni-farmacia"
database_id = "a4622bd3-6b64-4d9c-b469-f83480fe683b"

# Avviso email allo staff per ogni nuova recensione (Cloudflare Email Routing)
[[send_email]]
name = "AVVISI"
destination_address = "farmaciatortorici@live.it"

# Segreti da impostare nel pannello Cloudflare (Settings > Variables and Secrets), NON qui:
#   ADMIN_PASSWORD  -> password della pagina /admin.html
#   IP_SALT         -> una stringa casuale qualsiasi
